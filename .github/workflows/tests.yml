name: tests

# Every push and every PR. The suite is fast (~15s) and gates the deploy.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps
        run: pip install pytest fastapi httpx uvicorn
      - name: Run all tests
        run: bash scripts/test.sh
