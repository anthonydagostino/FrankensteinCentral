name: Deploy to homelab

# Auto-deploy on every push to the working branch (or main). Runs on the
# self-hosted runner installed on the OptiPlex, which pulls the new code and
# runs `docker compose up -d --build`. See docs/SETUP-DEPLOY.md for the
# one-time runner install.
on:
  push:
    branches:
      - claude/personal-app-hub-vvpy4h
      - main
  workflow_dispatch: {}

# Never let two deploys run at once; let an in-flight one finish.
concurrency:
  group: frankenstein-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Only the box's runner (labeled "frankenstein") picks this up.
    runs-on: [self-hosted, frankenstein]
    steps:
      - name: Pull latest code and redeploy the stack
        run: bash "${FRANKENSTEIN_DIR:-$HOME/FrankensteinCentral}/scripts/deploy.sh" "${GITHUB_REF_NAME}"
