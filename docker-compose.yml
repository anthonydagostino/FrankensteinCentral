services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-frank}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-frank}
      POSTGRES_DB: ${POSTGRES_DB:-frankensteincentral}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-frank}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  gateway:
    build: ./gateway
    restart: unless-stopped
    environment:
      POWERBUY_URL: http://powerbuy:8000
      FITNESS_URL: http://fitness:8000
      GMAIL_URL: http://gmail:8000
      SCHEDULE_URL: http://schedule:8000
      ASSISTANT_URL: http://assistant:8000
    ports:
      - "8080:8000"
    depends_on:
      - powerbuy
      - fitness
      - gmail
      - schedule
      - assistant

  powerbuy:
    build: ./services/powerbuy
    restart: unless-stopped
    environment:
      # Your real PowerBuy backend (the Render API). Login pulls your purchases.
      POWERBUY_API_URL: ${POWERBUY_API_URL:-https://powerbuy.onrender.com/api}
      POWERBUY_EMAIL: ${POWERBUY_EMAIL:-}
      POWERBUY_PASSWORD: ${POWERBUY_PASSWORD:-}
    ports:
      - "8081:8000"

  fitness:
    build: ./services/fitness
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-frank}:${POSTGRES_PASSWORD:-frank}@db:5432/${POSTGRES_DB:-frankensteincentral}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8082:8000"

  finance:
    build: ./services/finance
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-frank}:${POSTGRES_PASSWORD:-frank}@db:5432/${POSTGRES_DB:-frankensteincentral}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8086:8000"

  tasks:
    build: ./services/tasks
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-frank}:${POSTGRES_PASSWORD:-frank}@db:5432/${POSTGRES_DB:-frankensteincentral}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8087:8000"

  budget:
    build: ./services/budget
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-frank}:${POSTGRES_PASSWORD:-frank}@db:5432/${POSTGRES_DB:-frankensteincentral}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8088:8000"

  deals:
    build: ./services/deals
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-frank}:${POSTGRES_PASSWORD:-frank}@db:5432/${POSTGRES_DB:-frankensteincentral}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8089:8000"

  networth:
    build: ./services/networth
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-frank}:${POSTGRES_PASSWORD:-frank}@db:5432/${POSTGRES_DB:-frankensteincentral}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8090:8000"

  vault:
    build: ./services/vault
    restart: unless-stopped
    # Read-only client for your Vaultwarden — stores nothing. Set VAULT_MODE to
    # "bitwarden" and BW_SERVE_URL to your `bw serve` endpoint when you're home.
    environment:
      VAULT_MODE: ${VAULT_MODE:-mock}
      BW_SERVE_URL: ${BW_SERVE_URL:-}
    ports:
      - "8091:8000"

  jellyfin:
    build: ./services/jellyfin
    restart: unless-stopped
    # Read-only client for your Jellyfin. Empty vars = sample data. Fill in when
    # you're home (Jellyfin dashboard -> API Keys).
    environment:
      JELLYFIN_URL: ${JELLYFIN_URL:-}
      JELLYFIN_API_KEY: ${JELLYFIN_API_KEY:-}
      JELLYFIN_USER_ID: ${JELLYFIN_USER_ID:-}
      # Address your browser uses for Jellyfin deep links (defaults to JELLYFIN_URL)
      JELLYFIN_WEB_URL: ${JELLYFIN_WEB_URL:-}
    ports:
      - "8092:8000"

  # --- Real Firefly III, running inside FrankensteinCentral ------------------
  # Its own database (kept separate from the app's Postgres so nothing collides).
  firefly-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${FIREFLY_DB_USER:-firefly}
      POSTGRES_PASSWORD: ${FIREFLY_DB_PASSWORD:-firefly}
      POSTGRES_DB: ${FIREFLY_DB_NAME:-firefly}
    volumes:
      - firefly_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${FIREFLY_DB_USER:-firefly}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The actual Firefly III web app. Reach it in the browser at
  # http://<box-ip>:8095 to register your account, add data, and make a token.
  fireflyiii:
    image: fireflyiii/core:latest
    restart: unless-stopped
    environment:
      APP_KEY: ${FIREFLY_APP_KEY:-xQVbYZDDTTLf6B0unDPvEvVhmRW6H2jj}
      APP_URL: ${FIREFLY_WEB_URL:-http://localhost:8095}
      TZ: ${TZ:-America/New_York}
      TRUSTED_PROXIES: "**"
      DB_CONNECTION: pgsql
      DB_HOST: firefly-db
      DB_PORT: 5432
      DB_DATABASE: ${FIREFLY_DB_NAME:-firefly}
      DB_USERNAME: ${FIREFLY_DB_USER:-firefly}
      DB_PASSWORD: ${FIREFLY_DB_PASSWORD:-firefly}
      SITE_OWNER: ${FIREFLY_SITE_OWNER:-admin@localhost}
      DEFAULT_LANGUAGE: en_US
      APP_ENV: production
    volumes:
      - firefly_upload:/var/www/html/storage/upload
    depends_on:
      firefly-db:
        condition: service_healthy
    ports:
      - "8095:8080"

  # Firefly III's official data importer — bring your bank CSVs / exports in.
  # Reach it at http://<box-ip>:8096 once you've made an access token.
  firefly-importer:
    image: fireflyiii/data-importer:latest
    restart: unless-stopped
    environment:
      FIREFLY_III_URL: http://fireflyiii:8080
      VANITY_URL: ${FIREFLY_WEB_URL:-http://localhost:8095}
      FIREFLY_III_ACCESS_TOKEN: ${FIREFLY_TOKEN:-}
      TZ: ${TZ:-America/New_York}
    depends_on:
      fireflyiii:
        condition: service_started
    ports:
      - "8096:8080"

  # Read-only client that surfaces your Firefly III numbers on the hub. It reads
  # the in-stack Firefly above by default; add FIREFLY_TOKEN (made in the
  # Firefly UI) to go live. Empty token = sample data.
  firefly:
    build: ./services/firefly
    restart: unless-stopped
    environment:
      FIREFLY_URL: ${FIREFLY_URL:-http://fireflyiii:8080}
      FIREFLY_TOKEN: ${FIREFLY_TOKEN:-}
      # Browser-facing URL for the "Open in Firefly" / importer deep links.
      FIREFLY_WEB_URL: ${FIREFLY_WEB_URL:-}
      FIREFLY_IMPORTER_URL: ${FIREFLY_IMPORTER_URL:-}
    depends_on:
      fireflyiii:
        condition: service_started
    ports:
      - "8094:8000"

  gmail:
    build: ./services/gmail
    restart: unless-stopped
    environment:
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8083/auth/callback}
      # Reuse the Gmail connection PowerBuy already has (headless, no browser click).
      GOOGLE_REFRESH_TOKEN: ${GOOGLE_REFRESH_TOKEN:-}
      # Override which slice of the inbox to triage (default: primary tab, last 7d).
      GMAIL_QUERY: ${GMAIL_QUERY:-}
      GMAIL_TOKEN_FILE: /data/token.json
    volumes:
      # Persists the Gmail refresh token so the one-time "Allow" survives restarts.
      - gmail_token:/data
    ports:
      - "8083:8000"

  schedule:
    build: ./services/schedule
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-frank}:${POSTGRES_PASSWORD:-frank}@db:5432/${POSTGRES_DB:-frankensteincentral}
      # Borrows the gmail service's connected Google account (via its
      # /internal/token endpoint) to push events to the real Google Calendar.
      GMAIL_URL: http://gmail:8000
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-primary}
    depends_on:
      db:
        condition: service_healthy
      gmail:
        condition: service_started
    ports:
      - "8084:8000"

  assistant:
    build: ./services/assistant
    restart: unless-stopped
    environment:
      POWERBUY_URL: http://powerbuy:8000
      FITNESS_URL: http://fitness:8000
      GMAIL_URL: http://gmail:8000
      SCHEDULE_URL: http://schedule:8000
      FINANCE_URL: http://finance:8000
      TASKS_URL: http://tasks:8000
      BUDGET_URL: http://budget:8000
      DEALS_URL: http://deals:8000
      NETWORTH_URL: http://networth:8000
      VAULT_URL: http://vault:8000
      JELLYFIN_SVC_URL: http://jellyfin:8000
      FIREFLY_URL_SVC: http://firefly:8000
      DATABASE_URL: postgresql://${POSTGRES_USER:-frank}:${POSTGRES_PASSWORD:-frank}@db:5432/${POSTGRES_DB:-frankensteincentral}
      # Assistant auto-syncs on this interval (seconds); 0 disables.
      AUTO_SYNC_SECONDS: ${AUTO_SYNC_SECONDS:-0}
      # Bones texts you. Channel: telegram | whatsapp | sms | webhook (empty = off).
      NOTIFY_CHANNEL: ${NOTIFY_CHANNEL:-}
      NOTIFY_ON_SYNC: ${NOTIFY_ON_SYNC:-false}
      NOTIFY_TO: ${NOTIFY_TO:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-}
      TWILIO_SMS_FROM: ${TWILIO_SMS_FROM:-}
      NOTIFY_WEBHOOK_URL: ${NOTIFY_WEBHOOK_URL:-}
    ports:
      - "8085:8000"
    depends_on:
      db:
        condition: service_healthy
      powerbuy:
        condition: service_started
      fitness:
        condition: service_started
      gmail:
        condition: service_started
      schedule:
        condition: service_started
      finance:
        condition: service_started
      tasks:
        condition: service_started
      budget:
        condition: service_started
      deals:
        condition: service_started
      networth:
        condition: service_started
      vault:
        condition: service_started
      jellyfin:
        condition: service_started
      firefly:
        condition: service_started

volumes:
  db_data:
  gmail_token:
  firefly_db_data:
  firefly_upload:
