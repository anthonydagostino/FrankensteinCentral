<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FrankensteinCentral</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="hq-screen" id="hq">
      <div class="stage-wrap">
        <canvas id="stage"></canvas>
      </div>

      <header class="hud-top">
        <div class="brand">
          <span class="bolt">⚡</span>
          <div>
            <h1>FrankensteinCentral</h1>
            <p class="tagline">Bones runs the floor. Click a station to open it — click Bones' Desk for your briefing.</p>
          </div>
        </div>
        <div class="hud-top-right">
          <a href="/jobs.html" class="job-hunt-link" title="Ongoing pros/cons — 233 Analytics, DeepL, AIRIA, EliseAI">
            🧭 Job Hunt Tracker
          </a>
          <div id="clock" class="clock"></div>
        </div>
      </header>

      <section id="overview" class="overview hud-overview"></section>

      <div class="hud-controls">
        <button class="btn" id="dispatch">Dispatch team ▶</button>
        <label class="hq-toggle">
          <input type="checkbox" id="auto" /> Auto every 12s
        </label>
      </div>

      <aside class="hq-aside hud-aside">
        <div class="hq-card">
          <h4>Bones' Notebook</h4>
          <div id="notes"><p class="empty">No notes yet. Hit Dispatch.</p></div>
        </div>
        <div class="hq-card">
          <h4>Deadlines spotted</h4>
          <div id="deadlines"><p class="empty">Nothing tracked yet.</p></div>
        </div>
        <div class="hq-card">
          <h4>Floor activity</h4>
          <div id="feed" class="feed"><p class="empty">Quiet on the floor.</p></div>
        </div>
        <div class="hq-card">
          <h4>The team</h4>
          <div class="hq-legend" id="legend"></div>
        </div>
      </aside>
    </div>

    <div class="overlay" id="overlay">
      <div class="modal" role="dialog" aria-modal="true">
        <div class="modal-head">
          <span class="card-icon" id="modal-icon"></span>
          <div>
            <h2 id="modal-title"></h2>
            <span class="mode" id="modal-mode"></span>
          </div>
          <button class="close" id="modal-close" aria-label="Close">×</button>
        </div>
        <div class="modal-body" id="modal-body"></div>
      </div>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
