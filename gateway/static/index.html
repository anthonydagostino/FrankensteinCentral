<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FrankensteinCentral</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="bolt">⚡</span>
        <div>
          <h1>FrankensteinCentral</h1>
          <p class="tagline">One brain for all your apps.</p>
        </div>
      </div>
      <div id="clock" class="clock"></div>
    </header>

    <main>
      <section class="assistant-panel" id="assistant-panel">
        <div class="assistant-head">
          <span class="assistant-avatar">🧠</span>
          <div>
            <h2>Assistant briefing</h2>
            <p class="muted" id="assistant-sub">Pulling everything together…</p>
          </div>
          <a href="/lounge.html" class="btn btn-ghost">🎮 Assistant HQ</a>
          <button id="sync-btn" class="btn">Sync now</button>
        </div>
        <ul id="briefing" class="briefing"></ul>
      </section>

      <h2 class="section-title">Your apps</h2>
      <section id="apps" class="grid"></section>
    </main>

    <div class="overlay" id="overlay">
      <div class="modal" role="dialog" aria-modal="true">
        <div class="modal-head">
          <span class="card-icon" id="modal-icon"></span>
          <div>
            <h2 id="modal-title"></h2>
            <span class="mode" id="modal-mode"></span>
          </div>
          <button class="close" id="modal-close" aria-label="Close">×</button>
        </div>
        <div class="modal-body" id="modal-body"></div>
      </div>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
