<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FrankensteinCentral</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0a0c14" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Frankenstein" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/home.css" />
  </head>
  <body class="cc" data-mode="day">
    <!-- The whole page is four things: the week, the money, what is expiring
         on the Amex cards, and the weather beside the greeting. Anthony,
         2026-09-09: "the only useful shit right now is the stocks, the
         financial section, and the calendar." Everything else that used to
         be here (habit scores, a nudge engine, inbox triage, Big 3, quick
         capture, a weekly review, a command palette, seasonal decoration)
         was removed on 2026-10-06. -->
    <header class="cc-top">
      <div class="cc-hello">
        <div class="cc-time" id="cc-clock">—</div>
        <h1 id="cc-greeting">Good day</h1>
        <p class="cc-date" id="cc-date"></p>
      </div>
      <!-- Anthony, 2026-09-18: "put the weather right next to the Good evening
           at the top. I want it to not take up so much space either." One line:
           sky, degrees, high and low, the rest of today by the hour, place. -->
      <button class="cc-wx-pill" id="cc-weather" title="Weather"></button>
      <div class="cc-top-actions">
        <!-- Plex and Vaultwarden are one click from the main screen (SCRUM-140):
             "These are non negotiable." -->
        <a class="cc-icon-btn cc-launch" id="cc-plex" href="https://app.plex.tv/desktop" target="_blank" rel="noopener" title="Open Plex">🎬</a>
        <a class="cc-icon-btn cc-launch" id="cc-vault" href="#" target="_blank" rel="noopener" title="Open Vaultwarden">🔐</a>
        <button class="cc-icon-btn" id="cc-apps" title="Apps &amp; services">▦</button>
        <button class="cc-icon-btn" id="cc-settings-btn" title="Settings">⚙</button>
        <!-- Shown by auth.js only when a password is set AND this browser holds
             a session (SCRUM-98). A session you cannot end is half a feature. -->
        <form id="fc-logout" method="post" action="/logout" hidden>
          <button class="cc-icon-btn" type="submit" title="Sign out">⎋</button>
        </form>
      </div>
    </header>

    <main class="cc-main" id="cc-grid">
      <section class="cc-card cc-cal" id="cc-calendar"></section>
      <!-- Money on the left, the three shorter cards stacked beside it. The
           money card is tall (pay cycle, runway, the category donut, the
           accounts) and the others are not; side by side nothing hangs in
           empty space. Below ~640px the row stacks. -->
      <div class="cc-money-row">
        <section class="cc-card" id="cc-money"></section>
        <div class="cc-side">
          <section class="cc-card" id="cc-portfolio"></section>
          <section class="cc-card" id="cc-resale"></section>
          <section class="cc-card cc-ax" id="cc-amex"></section>
        </div>
      </div>
    </main>

    <!-- Operator facts, one line each, out of the way: when the data was
         fetched, whether every service answered, what build the box is
         running, and whether the data is backed up and restorable. -->
    <footer class="cc-foot">
      <span id="cc-updated">—</span>
      <span id="cc-systems"></span>
      <span id="cc-deploy"></span>
      <span id="cc-safety"></span>
    </footer>

    <!-- Apps & services launcher -->
    <div class="launcher-overlay" id="launcher" hidden>
      <div class="launcher" role="dialog" aria-modal="true">
        <div class="launcher-head">
          <h2>Apps &amp; services</h2>
          <button class="close" id="launcher-close" aria-label="Close">×</button>
        </div>
        <p class="launcher-hint">Click a tile for its dashboard view · <b>↗</b> opens the full app</p>
        <div class="launcher-grid" id="launcher-grid"><p class="att-empty">Loading…</p></div>
      </div>
    </div>

    <!-- Settings -->
    <div class="settings-overlay" id="settings" hidden>
      <div class="settings-box">
        <div class="settings-head">
          <h2>Settings</h2>
          <button class="close" id="settings-close" aria-label="Close">×</button>
        </div>
        <div class="settings-body" id="settings-body"></div>
        <div class="settings-foot">
          <button class="btn" id="settings-save">Save</button>
          <span id="settings-status" class="muted"></span>
        </div>
      </div>
    </div>

    <!-- App detail modal (reused by app.js) -->
    <div class="overlay" id="overlay">
      <div class="modal" role="dialog" aria-modal="true">
        <div class="modal-head">
          <span class="card-icon" id="modal-icon"></span>
          <div>
            <h2 id="modal-title"></h2>
            <span class="mode" id="modal-mode"></span>
          </div>
          <button class="close" id="modal-close" aria-label="Close">×</button>
        </div>
        <div class="modal-body" id="modal-body"></div>
      </div>
    </div>

    <script src="/auth.js"></script>
    <script src="/weekclock.js"></script>
    <script src="/evcolor.js"></script>
    <script src="/health.js"></script>
    <script src="/deploy.js"></script>
    <script src="/donut.js"></script>
    <script src="/offline.js"></script>
    <script src="/app.js"></script>
    <script src="/home.js"></script>
  </body>
</html>
